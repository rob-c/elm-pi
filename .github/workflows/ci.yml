name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # package.json asks for "latest"; installs take config/versions.json. So
      # does CI, or the release tests (provider inventory, schemas, credential
      # list) would check npm's newest pi rather than the one installs get.
      # pi's sibling dev packages follow pi's version. The extension packages
      # are not installed: nothing here can load them without the bundled node.
      - name: Pin development dependencies to the tested versions
        run: |
          python3 scripts/pin_versions.py --versions config/versions.json dev package.json > "$RUNNER_TEMP/package.json"
          cp "$RUNNER_TEMP/package.json" package.json
          cat package.json
      - name: Install development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Show the pi under test
        run: node -p 'require("./node_modules/@earendil-works/pi-coding-agent/package.json").version + " / pi-ai " + require("./node_modules/@earendil-works/pi-ai/package.json").version'
      - name: Run source, unit and type checks
        run: ./scripts/check.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck
        run: shellcheck -x install.sh bootstrap.sh configure.sh pi pi.orig shim/run.sh lib/*.sh scripts/*.sh
